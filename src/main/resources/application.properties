server.port=8090
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
bank.simulator.url=http://localhost:8080

# Actuator
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId}][%X{paymentId}] %logger{36} - %msg%n
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.status.order=DOWN,DEGRADED,UP
management.endpoint.health.status.http-mapping.degraded=200
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Payment Gateway
info.app.description=REST API for processing card payments via an acquiring bank

# Resilience4J circuit breaker for bank health checks
# Opens after 3 consecutive failures; stays open for 30s before allowing a single probe
resilience4j.circuitbreaker.instances.bankSimulator.slidingWindowSize=3
resilience4j.circuitbreaker.instances.bankSimulator.failureRateThreshold=100
resilience4j.circuitbreaker.instances.bankSimulator.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.bankSimulator.permittedNumberOfCallsInHalfOpenState=1
resilience4j.circuitbreaker.instances.bankSimulator.automaticTransitionFromOpenToHalfOpenEnabled=true
